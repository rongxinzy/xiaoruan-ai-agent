name: Custom edition

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custom-edition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - run: npm run lint
      - run: npm run build
      - run: bunx tsc --project electron-tsconfig.json --noEmit
      - name: Verify custom edition boundaries
        run: npm test -- src/renderer/index.test.ts src/renderer/services/availableModels.test.ts src/shared/providers/constants.test.ts src/main/libs/agentEngine/piRuntimeAdapter.test.ts src/main/appConstants.test.ts tests/brandIdentity.test.ts
