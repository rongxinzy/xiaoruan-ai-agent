name: Custom edition

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custom-edition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - run: npm run lint
      - run: npm run build
      - run: bunx tsc --project electron-tsconfig.json --noEmit
      - name: Verify custom edition boundaries
        run: npm test -- src/renderer/index.test.ts src/renderer/services/availableModels.test.ts src/shared/providers/constants.test.ts src/main/libs/agentEngine/piRuntimeAdapter.test.ts src/main/appConstants.test.ts src/main/productIdentity.test.ts src/main/coworkPrompt/composer.test.ts src/main/im/imChatHandler.test.ts src/main/im/imCoworkHandler.test.ts src/scheduledTask/enginePrompt.test.ts tests/brandIdentity.test.ts
      - name: Verify scheduled task titles, folder actions and native ABI
        run: npm test -- src/renderer/utils/sessionTitle.test.ts src/shared/cowork/constants.test.ts src/renderer/components/agentSidebar src/renderer/components/scheduledTasks src/renderer/components/Sidebar.search.test.ts src/renderer/components/cowork/CoworkSearchModal.test.ts src/scheduledTask/piScheduledTaskExecutor.test.ts scripts/electron-native-abi.test.ts src/main/scheduledSessionTitles src/main/sqliteStore.test.ts src/renderer/components/AISphereSettings.test.ts
      - name: Verify isolated package storage
        run: bunx vitest run scripts/release/upload-custom-packages.test.ts scripts/release/verify-windows-artifact-source.test.ts tests/customReleaseIsolation.test.ts
      - name: Verify configured chat transports and installer identity
        run: bunx vitest run src/renderer/services/chatChatTransport.test.ts src/renderer/services/ipcChatTransport.test.ts src/renderer/services/api.webSearch.test.ts src/renderer/services/chatToolCapabilityPolicy.test.ts src/renderer/services/toolCallUnsupported.test.ts src/renderer/services/i18n.modelCapabilities.test.ts tests/nsis-installer.test.ts
      - name: Verify AISphere exclusive access and transport
        run: bunx vitest run src/main/aisphere src/main/libs/claudeSettings.test.ts src/renderer/services/managedModelUiPolicy.test.ts src/renderer/store/slices/modelSlice.test.ts src/renderer/services/providerModelConnection.test.ts src/renderer/services/providerModelDiscovery.test.ts
      - name: Verify theme packages and configuration
        run: bunx vitest run src/renderer/theme src/renderer/services/theme.test.ts src/renderer/services/config.test.ts
      - name: Verify Windows packaging contracts
        run: bun test tests/runtimePackagingConfig.test.ts scripts/ci/gates/windows.test.ts scripts/ci/gates/policy.test.ts
