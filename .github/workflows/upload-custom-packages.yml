name: Store Xiaoruan packages in private R2

on:
  workflow_dispatch:
    inputs:
      source-run-id:
        description: Existing verified Windows build run to upload
        required: true
        type: string
  workflow_call:
    inputs:
      artifact-pattern:
        required: true
        type: string
      expected-artifacts:
        required: true
        type: number
      source-commit:
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  upload:
    if: github.repository == 'rongxinzy/xiaoruan-ai-agent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: xiaoruan-release
    timeout-minutes: 30
    env:
      R2_BUCKET: xiaoruan-releases
      PACKAGE_SOURCE_COMMIT: ${{ inputs.source-commit || github.sha }}
      XIAORUAN_R2_ACCOUNT_ID: ${{ vars.XIAORUAN_R2_ACCOUNT_ID }}
    steps:
      # Use the reviewed workflow revision for upload tooling even when the
      # candidate was built from an older source-commit. That input labels bytes.
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Verify existing Windows build provenance
        if: github.event_name == 'workflow_dispatch' && inputs.source-run-id != ''
        id: source
        env:
          SOURCE_RUN_ID: ${{ inputs.source-run-id }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/verify-windows-artifact-source.mjs
      - name: Check dedicated storage configuration
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.XIAORUAN_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.XIAORUAN_R2_SECRET_ACCESS_KEY }}
        run: node --input-type=module -e "import { uploadIdentity } from './scripts/release/upload-custom-packages.mjs'; uploadIdentity(process.env)"
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.artifact-pattern || 'windows-build' }}
          run-id: ${{ inputs.source-run-id || github.run_id }}
          github-token: ${{ github.token }}
          path: packages
      - name: Verify and store installers
        env:
          EXPECTED_ARTIFACTS: ${{ inputs.expected-artifacts || 1 }}
          PACKAGE_SOURCE_COMMIT: ${{ steps.source.outputs.source-commit || inputs.source-commit || github.sha }}
          SOURCE_BUILD_RUN_ID: ${{ steps.source.outputs.source-run-id || github.run_id }}
          AWS_ACCESS_KEY_ID: ${{ secrets.XIAORUAN_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.XIAORUAN_R2_SECRET_ACCESS_KEY }}
        run: node scripts/release/upload-custom-packages.mjs packages "$EXPECTED_ARTIFACTS"
      - uses: actions/upload-artifact@v6
        with:
          name: xiaoruan-r2-upload-receipt
          path: custom-upload-receipt/packages.json
          if-no-files-found: error
          retention-days: 30
