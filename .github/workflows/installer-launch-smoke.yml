name: Smoke-test the signed Windows installer

on:
  workflow_dispatch:
    inputs:
      installer-url:
        description: 'Public URL of the signed Windows installer to download, install and launch'
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  installer-launch-smoke:
    if: github.repository == 'rongxinzy/xiaoruan-ai-agent' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Download and verify the signed installer
        shell: powershell
        env:
          INSTALLER_URL: ${{ inputs.installer-url }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'xiaoruan-setup.exe'
          Invoke-WebRequest -Uri $env:INSTALLER_URL -OutFile $installer
          if ((Get-Item -LiteralPath $installer).Length -lt 100MB) {
            throw 'Downloaded installer is suspiciously small.'
          }
          $signature = Get-AuthenticodeSignature -FilePath $installer
          if ($signature.Status -ne 'Valid') {
            throw "Installer Authenticode status is $($signature.Status), expected Valid."
          }
          "INSTALLER_PATH=$installer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Silent-install the app
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Start-Process -FilePath $env:INSTALLER_PATH -ArgumentList '/S' -PassThru
          if (-not $setup.WaitForExit(10 * 60 * 1000)) {
            Stop-Process -Id $setup.Id -Force -ErrorAction SilentlyContinue
            throw 'Installer did not finish within 10 minutes.'
          }
          if ($setup.ExitCode -ne 0) {
            throw "Installer exited with code $($setup.ExitCode)."
          }
      - name: Stop any auto-launched app instance
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Process -ErrorAction SilentlyContinue |
            Where-Object { $_.Path -and $_.Path -like '*\Programs\xiaoruan-ai-agent\*' } |
            Stop-Process -Force
          Start-Sleep -Seconds 3
      - name: Launch the installed app to a visible window
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-Content -LiteralPath package.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $builder = Get-Content -LiteralPath electron-builder.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $exeName = $builder.executableName
          if (-not $exeName) { $exeName = $builder.productName }
          $exe = Join-Path $env:LOCALAPPDATA ("Programs\{0}\{1}.exe" -f $package.name, $exeName)
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File scripts/ci/windows-app-launch-smoke.ps1 `
            -ExePath $exe -WindowTimeoutSeconds 300
          if ($LASTEXITCODE -ne 0) {
            throw "Installed app launch smoke failed with exit code $LASTEXITCODE."
          }
