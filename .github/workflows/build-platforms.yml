name: Build Xiaoruan Windows package to R2 (manual)

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Package SemVer without a v prefix (e.g. 1.0.1). Optional leading v is stripped.'
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  resolve-version:
    if: github.repository == 'rongxinzy/xiaoruan-ai-agent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          raw="${RELEASE_VERSION#v}"
          raw="${raw#V}"
          if [[ ! "$raw" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "release_version must be SemVer (got: $RELEASE_VERSION)" >&2
            exit 1
          fi
          echo "version=$raw" >> "$GITHUB_OUTPUT"
          {
            echo '### Build identity'
            echo
            echo "- package version: \`$raw\`"
            echo "- source commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-platforms:
    needs: resolve-version
    if: github.repository == 'rongxinzy/xiaoruan-ai-agent' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    # Certum signing credentials live on the shared release environment.
    environment: release
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Enforce retired runtime decoupling
        run: node scripts/ci/check-openclaw-decoupling.mjs
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Restore packaging caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ~/.npm
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            vendor/engram-runtime
            vendor/channel-runtime
          key: packaging-${{ runner.os }}-win-x64-node24-bun1.4.0-${{ hashFiles('bun.lock', 'package.json', 'scripts/**') }}
          restore-keys: |
            packaging-${{ runner.os }}-win-x64-node24-bun1.4.0-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run apply:patches
      - name: Set up Windows runtimes
        run: |
          bun run setup:uv-runtime
          bun run setup:python-runtime
          bun run engram:runtime:win-x64
      - name: Connect Certum SimplySign
        id: certum-signing
        uses: ./.github/actions/setup-certum-signing
        with:
          user-id: ${{ secrets.CERTUM_USER_ID }}
          otp-uri: ${{ secrets.CERTUM_OTP_URI }}
          certificate-thumbprint: ${{ secrets.CERTUM_CERT_THUMBPRINT }}
      - name: Build Windows
        run: bun run dist:win:signed
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          APP_BUILD_VERSION: ${{ needs.resolve-version.outputs.version }}
          CERTUM_CERT_THUMBPRINT: ${{ steps.certum-signing.outputs.thumbprint }}
          MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
      - name: Verify Windows Authenticode signatures
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File scripts/ci/verify-windows-authenticode.ps1
          -ProjectRoot '${{ github.workspace }}'
          -ExpectedThumbprint '${{ steps.certum-signing.outputs.thumbprint }}'
      - name: Verify packaged app version
        shell: bash
        run: node scripts/ci/verify-packaged-app-version.mjs '${{ needs.resolve-version.outputs.version }}'
      - name: Verify Windows package runtimes with a clean PATH
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File scripts/ci/windows-runtime-smoke.ps1
          -ProjectRoot ${{ github.workspace }}
      - uses: actions/upload-artifact@v6
        with:
          name: windows-build
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7

  upload-packages:
    needs: [build-platforms]
    uses: ./.github/workflows/upload-custom-packages.yml
    secrets: inherit
