name: Build Xiaoruan Windows package (manual)

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Package SemVer without a v prefix (e.g. 1.0.1). Optional leading v is stripped.'
        required: true
        type: string
      release:
        description: 'Sign the package via the central ZhiYuan signing workflow and publish it to R2. Disable for an unsigned validation build only.'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-platforms:
    if: github.repository == 'rongxinzy/xiaoruan-ai-agent' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.resolve-version.outputs.version }}
    steps:
      - name: Resolve package version
        id: resolve-version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          raw="${RELEASE_VERSION#v}"
          raw="${raw#V}"
          if [[ ! "$raw" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "release_version must be SemVer (got: $RELEASE_VERSION)" >&2
            exit 1
          fi
          echo "version=$raw" >> "$GITHUB_OUTPUT"
          {
            echo '### Build identity'
            echo
            echo "- package version: \`$raw\`"
            echo "- source commit: \`$GITHUB_SHA\`"
            echo "- run id: \`$GITHUB_RUN_ID\`"
            echo "- artifact: \`windows-build\` (unsigned)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v6
      - name: Enforce retired runtime decoupling
        run: node scripts/ci/check-openclaw-decoupling.mjs
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Restore packaging caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.npm
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            vendor/engram-runtime
            vendor/channel-runtime
          key: packaging-${{ runner.os }}-win-x64-node24-bun1.4.0-${{ hashFiles('bun.lock', 'package.json', 'scripts/**') }}
          restore-keys: |
            packaging-${{ runner.os }}-win-x64-node24-bun1.4.0-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run apply:patches
      - name: Set up Windows runtimes
        run: |
          bun run setup:uv-runtime
          bun run setup:python-runtime
          bun run engram:runtime:win-x64
      - name: Build Windows
        run: bun run dist:win
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          APP_BUILD_VERSION: ${{ steps.resolve-version.outputs.version }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
      - name: Verify packaged app version
        shell: bash
        run: node scripts/ci/verify-packaged-app-version.mjs '${{ steps.resolve-version.outputs.version }}'
      - name: Verify Windows package runtimes with a clean PATH
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File scripts/ci/windows-runtime-smoke.ps1
          -ProjectRoot ${{ github.workspace }}
      - uses: actions/upload-artifact@v6
        with:
          name: windows-build
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: build-platforms
    if: inputs.release
    uses: rongxinzy/RongxinAI/.github/workflows/sign-xiaoruan-windows.yml@main
    with:
      source_run_id: ${{ github.run_id }}
      release_version: ${{ needs.build-platforms.outputs.version }}
    secrets:
      # The workflow_call boundary cannot forward environment secrets, and the
      # called workflow cannot see this repository's release environment. The
      # Certum credentials are therefore read from repository-level secrets
      # (same values as the release environment) and passed explicitly.
      CERTUM_USER_ID: ${{ secrets.CERTUM_USER_ID }}
      CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
      CERTUM_CERT_THUMBPRINT: ${{ secrets.CERTUM_CERT_THUMBPRINT }}
      MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
