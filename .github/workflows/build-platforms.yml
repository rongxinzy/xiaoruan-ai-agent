name: Build Xiaoruan Windows package to private R2 (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  plan-platforms:
    if: github.repository == 'rongxinzy/xiaoruan-ai-agent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - id: plan
        shell: bash
        run: |
          matrix='{"include":[{"platform":"windows","runner":"windows-latest","artifact":"windows-build","runtime_target":"win-x64"}]}'
          count=1
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

  storage-config:
    needs: plan-platforms
    runs-on: ubuntu-latest
    environment: xiaoruan-release
    steps:
      - name: Require dedicated R2 credentials before building
        env:
          ACCOUNT_ID: ${{ vars.XIAORUAN_R2_ACCOUNT_ID }}
          ACCESS_KEY: ${{ secrets.XIAORUAN_R2_ACCESS_KEY_ID }}
          SECRET_KEY: ${{ secrets.XIAORUAN_R2_SECRET_ACCESS_KEY }}
        run: |
          [[ -n "$ACCOUNT_ID" && -n "$ACCESS_KEY" && -n "$SECRET_KEY" ]] || {
            echo 'Configure XIAORUAN_R2_ACCOUNT_ID and dedicated R2 secrets in xiaoruan-release' >&2
            exit 1
          }

  build-platforms:
    needs: [plan-platforms, storage-config]
    strategy:
      # Keep the matrix contract with exactly one Windows x64 target.
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan-platforms.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    environment: xiaoruan-release
    # A release build may download upstream runtimes, but it must never consume
    # a runner indefinitely when an upstream command stalls.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Enforce retired runtime decoupling
        run: node scripts/ci/check-openclaw-decoupling.mjs
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Restore packaging caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ~/.npm
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            vendor/engram-runtime
            vendor/channel-runtime
          key: packaging-${{ runner.os }}-${{ matrix.runtime_target }}-node24-bun1.4.0-${{ hashFiles('bun.lock', 'package.json', 'scripts/**') }}
          restore-keys: |
            packaging-${{ runner.os }}-${{ matrix.runtime_target }}-node24-bun1.4.0-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run apply:patches
      - name: Set up Windows runtimes
        run: |
          bun run setup:uv-runtime
          bun run setup:python-runtime
          bun run engram:runtime:${{ matrix.runtime_target }}
      - name: Build Windows
        run: bun run dist:win
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
      - name: Verify Windows package runtimes with a clean PATH
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File scripts/ci/windows-runtime-smoke.ps1
          -ProjectRoot ${{ github.workspace }}
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7

  upload-packages:
    needs: [plan-platforms, build-platforms]
    uses: ./.github/workflows/upload-custom-packages.yml
    with:
      artifact-pattern: windows-build
      expected-artifacts: 1
